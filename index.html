<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8738a">
<title>出産祝い管理</title>
<style>
  :root {
    --main: #e8738a;
    --main-dark: #c75a71;
    --bg: #fff8f9;
    --card: #ffffff;
    --text: #333333;
    --sub: #777777;
    --line: #eadde0;
    --ok: #3a9d6b;
    --ng: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    padding-bottom: 96px;
  }
  header {
    background: var(--main);
    color: #fff;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 18px; }
  .summary { margin-top: 6px; font-size: 14px; opacity: .95; }
  .summary b { font-size: 18px; }

  .tools { padding: 12px 16px 4px; }
  .tools input[type=search] {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tabs button {
    flex: 1; padding: 10px 0; font-size: 15px;
    border: 1px solid var(--main); background: #fff; color: var(--main);
    border-radius: 10px;
  }
  .tabs button.on { background: var(--main); color: #fff; }

  #list { padding: 8px 16px; }
  .item {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item .name { font-size: 17px; font-weight: bold; }
  .badge {
    font-size: 13px; padding: 3px 10px; border-radius: 999px; color: #fff; white-space: nowrap;
  }
  .badge.done { background: var(--ok); }
  .badge.todo { background: var(--ng); }
  .item .gift { margin-top: 4px; }
  .item .meta { margin-top: 4px; font-size: 13px; color: var(--sub); }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }

  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    background: var(--main); color: #fff; border: none; border-radius: 999px;
    padding: 16px 24px; font-size: 17px; font-weight: bold;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }
  .backup {
    position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    background: #fff; color: var(--main-dark); border: 1px solid var(--main);
    border-radius: 999px; padding: 14px 18px; font-size: 14px;
  }

  /* 入力画面 */
  dialog {
    width: 100%; max-width: 520px; max-height: 100%; height: 100%;
    margin: 0 auto; padding: 0; border: none; background: var(--bg);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head {
    background: var(--main); color: #fff; padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    font-size: 18px; font-weight: bold;
  }
  form { padding: 14px 16px 120px; }
  label { display: block; margin-top: 14px; font-size: 14px; color: var(--sub); }
  input[type=text], input[type=number], input[type=date], textarea {
    width: 100%; margin-top: 4px; padding: 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  textarea { min-height: 70px; }
  .check {
    display: flex; align-items: center; gap: 10px; margin-top: 18px;
    padding: 14px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; font-size: 17px; color: var(--text);
  }
  .check input { width: 24px; height: 24px; }
  #returnBox { display: none; }
  #returnBox.show { display: block; }
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
    display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .actions button { flex: 1; padding: 14px 0; font-size: 16px; border-radius: 10px; border: 1px solid var(--main); }
  .btn-save { background: var(--main); color: #fff; font-weight: bold; }
  .btn-cancel { background: #fff; color: var(--main); }
  .btn-del { background: #fff; color: var(--ng); border-color: var(--ng) !important; flex: .6 !important; }

  select {
    width: 100%; margin-top: 4px; padding: 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .photos .ph { position: relative; }
  .photos img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .photos .rm {
    position: absolute; top: -8px; right: -8px; width: 28px; height: 28px;
    border-radius: 50%; border: none; background: var(--ng); color: #fff; font-size: 16px;
  }
  .item .thumbs { display: flex; gap: 6px; margin-top: 8px; }
  .item .thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
  #dlgPhoto { background: #000; }
  #dlgPhoto img { width: 100%; height: 100%; object-fit: contain; }

  #login {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #login h2 { margin: 0 0 8px; color: var(--main-dark); }
  #login p { color: var(--sub); line-height: 1.6; margin: 8px 0; }
  #login button {
    margin-top: 16px; padding: 14px 28px; font-size: 17px; font-weight: bold;
    border: none; border-radius: 999px; background: var(--main); color: #fff;
  }
  #login.hidden { display: none; }

  .sheet { padding: 16px; }
  .sheet button {
    display: block; width: 100%; margin-top: 12px; padding: 14px; font-size: 16px;
    border-radius: 10px; border: 1px solid var(--main); background: #fff; color: var(--main-dark);
  }
  .sheet p { font-size: 14px; color: var(--sub); line-height: 1.6; }
</style>
</head>
<body>

<header>
  <h1>🎁 出産祝い管理</h1>
  <div class="summary">
    全 <b id="sAll">0</b> 件　お返し未了 <b id="sTodo">0</b> 件<br>
    現金のみ　<b id="sCash">0</b> 円<br>
    現金＋物品（概算）　<b id="sTotal">0</b> 円
  </div>
</header>

<div class="tools">
  <input type="search" id="q" placeholder="贈り主・品物で検索">
  <div class="tabs">
    <button data-f="all" class="on">すべて</button>
    <button data-f="todo">お返し未</button>
    <button data-f="done">お返し済</button>
  </div>
</div>

<div id="list"></div>

<button class="backup" id="btnBackup">保存・共有</button>
<button class="fab" id="btnAdd">＋ 追加</button>

<!-- 追加・編集 -->
<dialog id="dlgEdit">
  <div class="dlg-head" id="editTitle">祝いを追加</div>
  <form id="form" autocomplete="off">
    <label>贈り主（誰からもらったか）
      <input type="text" id="fFrom" required placeholder="例：山田 花子さん">
    </label>
    <label>種別
      <select id="fType">
        <option value="物品">物品</option>
        <option value="現金">現金</option>
        <option value="現金＋物品">現金＋物品</option>
      </select>
    </label>
    <label id="giftBox">品物
      <input type="text" id="fGift" placeholder="例：ベビー服、商品券">
    </label>
    <label>いただいた日
      <input type="date" id="fDate">
    </label>
    <label id="cashBox">現金の金額（円）
      <input type="number" id="fPrice" inputmode="numeric" min="0" placeholder="例：10000">
    </label>
    <label id="goodsBox">物品の目安金額（円）
      <input type="number" id="fGoods" inputmode="numeric" min="0" placeholder="例：5000">
    </label>
    <label>写真（最大3枚）
      <input type="file" id="fPhoto" accept="image/*" multiple>
    </label>
    <div class="photos" id="photoList"></div>
    <label>メモ
      <textarea id="fMemo" placeholder="例：お礼状は出した、アレルギー注意 など"></textarea>
    </label>

    <label class="check">
      <input type="checkbox" id="fReturned"> お返しを渡した
    </label>
    <div id="returnBox">
      <label>お返しの内容
        <input type="text" id="fReturnGift" placeholder="例：カタログギフト 3000円">
      </label>
      <label>渡した日
        <input type="date" id="fReturnDate">
      </label>
    </div>

    <div class="actions">
      <button type="button" class="btn-del" id="btnDel">削除</button>
      <button type="button" class="btn-cancel" id="btnCancel">閉じる</button>
      <button type="submit" class="btn-save">保存</button>
    </div>
  </form>
</dialog>

<!-- 写真の拡大表示 -->
<dialog id="dlgPhoto"><img id="bigPhoto" alt=""></dialog>

<!-- 保存・共有 -->
<dialog id="dlgBackup">
  <div class="dlg-head">保存・共有</div>
  <div class="sheet">
    <p>データはクラウドに保存され、同じアカウントでログインした端末どうしで自動的に同期されます。下のファイル書き出しは、念のためのバックアップ用です。</p>
    <p>ログイン中：<span id="userInfo"></span></p>
    <button id="btnExport">データを書き出す（バックアップ）</button>
    <button id="btnImport">データを読み込む</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
    <p>読み込み時は、今あるデータに追加されます。同じ記録は、更新日時が新しい方が残ります。</p>
    <button id="btnLogout">ログアウト</button>
    <button id="btnBackupClose">閉じる</button>
  </div>
</dialog>

<!-- ログイン画面 -->
<div id="login">
  <h2>🎁 出産祝い管理</h2>
  <p id="loginMsg">読み込み中…</p>
  <button id="btnLogin" hidden>Googleでログイン</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const LOCAL_KEY = 'shussan-iwai-v1'; // 旧：スマホ内保存版のデータ（移行用）
const $ = (id) => document.getElementById(id);

// ---- ログイン・データ同期（Firebase） ----
const configured = !String(firebaseConfig.apiKey).startsWith('YOUR');
let auth, db, giftsCol, unsub = null, migrationAsked = false;
let items = [];
let filter = 'all';
let editingId = null;

function showLogin(msg, canLogin) {
  $('login').classList.remove('hidden');
  $('loginMsg').innerHTML = msg;
  $('btnLogin').hidden = !canLogin;
}

if (!configured) {
  showLogin('Firebase の接続設定（firebase-config.js）がまだ入力されていません。', false);
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  // 端末内にもキャッシュを持つので、電波が悪い場所でも入力でき、つながった時に自動で反映される
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  giftsCol = collection(db, 'gifts');

  onAuthStateChanged(auth, (user) => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) {
      items = [];
      render();
      showLogin('ご家族のGoogleアカウントでログインしてください。', true);
      return;
    }
    $('userInfo').textContent = user.email || '';
    unsub = onSnapshot(giftsCol, (snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      $('login').classList.add('hidden');
      render();
      offerMigration();
    }, (err) => {
      if (err.code === 'permission-denied') {
        showLogin(`このアカウント（${esc(user.email)}）は使用が許可されていません。<br>別のアカウントでログインしてください。`, true);
        signOut(auth);
      } else {
        showLogin('データを読み込めませんでした。通信状況を確認して、再読み込みしてください。（' + esc(err.code) + '）', false);
      }
    });
  });
}

$('btnLogin').addEventListener('click', async () => {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      signInWithRedirect(auth, provider);
    } else if (e.code === 'auth/unauthorized-domain') {
      alert('このURLがFirebaseの「承認済みドメイン」に登録されていません。設定を確認してください。');
    } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
      alert('ログインできませんでした。（' + e.code + '）');
    }
  }
});
$('btnLogout').addEventListener('click', async () => {
  if (!confirm('ログアウトします。よろしいですか？')) return;
  $('dlgBackup').close();
  await signOut(auth);
});

// 記録を共有データへ追加（同じ記録は更新日時が新しい方を残す）。大きな写真が多くても通るよう少しずつ書き込む
async function mergeItems(list) {
  const todo = [];
  let added = 0, updated = 0;
  list.forEach(({ id, ...data }) => {
    if (!id) return;
    const cur = items.find((x) => x.id === id);
    if (!cur) { todo.push([id, data]); added++; }
    else if ((data.updatedAt || 0) > (cur.updatedAt || 0)) { todo.push([id, data]); updated++; }
  });
  for (let i = 0; i < todo.length; i += 10) {
    const batch = writeBatch(db);
    todo.slice(i, i + 10).forEach(([id, data]) => batch.set(doc(giftsCol, id), data));
    await batch.commit();
  }
  return { added, updated };
}

// 旧バージョン（スマホ内保存）のデータがあれば、共有データへ移すか確認する
function offerMigration() {
  if (migrationAsked) return;
  migrationAsked = true;
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch (e) { /* 読めなければ移行しない */ }
  if (!local.length || localStorage.getItem(LOCAL_KEY + '-moved')) return;
  if (!confirm(`この端末に保存されている ${local.length} 件を、共有データに追加しますか？\n（キャンセルすると、次回も確認します）`)) return;
  mergeItems(local)
    .then((r) => {
      try { localStorage.setItem(LOCAL_KEY + '-moved', '1'); } catch (e) { /* 保存できなくても移行自体は完了 */ }
      alert(`移行しました：追加 ${r.added} 件、更新 ${r.updated} 件\n（この端末内の元データは削除していません）`);
    })
    .catch((err) => alert('移行できませんでした。（' + (err.code || err.message) + '）'));
}

function showSaveError(err) {
  alert('保存できませんでした。ログイン状態・通信状況・写真の容量を確認してください。（' + (err.code || err.message) + '）');
}

const yen = (n) => Number(n || 0).toLocaleString('ja-JP');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// 金額の取り出し（現金／物品の目安額）。旧データの物品は price に目安額が入っているため、それも物品の目安額として扱う
const cashOf = (it) => (it.type === '現金' || it.type === '現金＋物品') ? Number(it.price || 0) : 0;
const goodsOf = (it) => it.type === '現金＋物品' ? Number(it.goods || 0)
  : (it.type === '現金' ? 0 : Number(it.goods ?? it.price ?? 0));
function amountText(it) {
  const c = cashOf(it), g = goodsOf(it);
  if (it.type === '現金') return '💴 現金' + (c ? `（${yen(c)}円）` : '');
  if (it.type === '現金＋物品') {
    return `💴🎁 現金${c ? ' ' + yen(c) + '円' : ''}＋${esc(it.gift)}${g ? `（目安${yen(g)}円）` : ''}`;
  }
  return '🎁 ' + esc(it.gift) + (g ? `（目安${yen(g)}円）` : '');
}

// ---- 一覧表示 ----
function render() {
  const kw = $('q').value.trim().toLowerCase();
  const shown = items
    .filter((it) => filter === 'all' || (filter === 'done') === !!it.returned)
    .filter((it) => !kw || (it.from + ' ' + it.type + ' ' + it.gift + ' ' + (it.memo || '')).toLowerCase().includes(kw))
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.updatedAt - a.updatedAt);

  $('sAll').textContent = items.length;
  $('sTodo').textContent = items.filter((it) => !it.returned).length;
  const cashSum = items.reduce((s, it) => s + cashOf(it), 0);
  const goodsSum = items.reduce((s, it) => s + goodsOf(it), 0);
  $('sCash').textContent = yen(cashSum);
  $('sTotal').textContent = yen(cashSum + goodsSum);

  if (!shown.length) {
    $('list').innerHTML = '<div class="empty">' +
      (items.length ? '該当するデータがありません' : '右下の「＋ 追加」から<br>いただいたお祝いを登録しましょう') + '</div>';
    return;
  }
  $('list').innerHTML = shown.map((it) => `
    <div class="item" data-id="${it.id}">
      <div class="top">
        <span class="name">${esc(it.from)}</span>
        <span class="badge ${it.returned ? 'done' : 'todo'}">${it.returned ? 'お返し済' : 'お返し未'}</span>
      </div>
      <div class="gift">${amountText(it)}</div>
      <div class="meta">${it.date ? 'いただいた日：' + esc(it.date) : ''}</div>
      ${it.photos && it.photos.length ? `<div class="thumbs">${it.photos.map((p) => `<img src="${p}" alt="写真">`).join('')}</div>` : ''}
      ${it.returned ? `<div class="meta">お返し：${esc(it.returnGift) || '（内容未入力）'}${it.returnDate ? '／' + esc(it.returnDate) : ''}</div>` : ''}
    </div>`).join('');
}

// ---- 追加・編集 ----
function openEdit(id) {
  editingId = id || null;
  const it = items.find((x) => x.id === id) || {};
  $('editTitle').textContent = id ? '祝いを編集' : '祝いを追加';
  $('fFrom').value = it.from || '';
  $('fType').value = it.type || '物品';
  $('fGift').value = it.gift || '';
  photos = [...(it.photos || [])];
  renderPhotos();
  $('fDate').value = it.date || new Date().toISOString().slice(0, 10);
  $('fPrice').value = (it.type || '物品') === '物品' ? '' : (it.price ?? '');
  $('fGoods').value = goodsOf(it) || '';
  $('fMemo').value = it.memo || '';
  $('fReturned').checked = !!it.returned;
  $('fReturnGift').value = it.returnGift || '';
  $('fReturnDate').value = it.returnDate || '';
  $('btnDel').style.display = id ? '' : 'none';
  toggleType();
  toggleReturn();
  $('dlgEdit').showModal();
}
// 種別に応じて、品物・現金・物品の目安金額の入力欄を出し分ける
function toggleType() {
  const t = $('fType').value;
  const hasCash = t !== '物品';
  const hasGoods = t !== '現金';
  $('giftBox').style.display = hasGoods ? '' : 'none';
  $('fGift').required = hasGoods;
  $('cashBox').style.display = hasCash ? '' : 'none';
  $('goodsBox').style.display = hasGoods ? '' : 'none';
}

// ---- 写真 ----
const MAX_PHOTOS = 3;
const MAX_SIZE = 640; // 長辺のピクセル数（1件約1MBの上限に収めるため縮小）
let photos = [];

function renderPhotos() {
  $('photoList').innerHTML = photos.map((p, i) => `
    <div class="ph">
      <img src="${p}" data-i="${i}" alt="写真">
      <button type="button" class="rm" data-i="${i}" aria-label="写真を削除">×</button>
    </div>`).join('');
}
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, MAX_SIZE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r);
      c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めません')); };
    img.src = url;
  });
}
$('fPhoto').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  for (const f of files) {
    if (photos.length >= MAX_PHOTOS) { alert(`写真は最大${MAX_PHOTOS}枚までです。`); break; }
    try { photos.push(await shrink(f)); }
    catch (err) { alert('この写真は読み込めませんでした。別の形式（JPEG・PNG）でお試しください。'); }
  }
  renderPhotos();
});
$('photoList').addEventListener('click', (e) => {
  const i = e.target.dataset.i;
  if (i === undefined) return;
  if (e.target.classList.contains('rm')) {
    photos.splice(Number(i), 1);
    renderPhotos();
  } else {
    $('bigPhoto').src = photos[i];
    $('dlgPhoto').showModal();
  }
});
$('dlgPhoto').addEventListener('click', () => $('dlgPhoto').close());
$('fType').addEventListener('change', toggleType);
function toggleReturn() {
  $('returnBox').classList.toggle('show', $('fReturned').checked);
  if ($('fReturned').checked && !$('fReturnDate').value) {
    $('fReturnDate').value = new Date().toISOString().slice(0, 10);
  }
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const returned = $('fReturned').checked;
  const type = $('fType').value;
  const data = {
    from: $('fFrom').value.trim(),
    type,
    gift: type === '現金' ? '' : $('fGift').value.trim(),
    photos: [...photos],
    date: $('fDate').value,
    price: type !== '物品' && $('fPrice').value !== '' ? Number($('fPrice').value) : '',
    goods: type !== '現金' && $('fGoods').value !== '' ? Number($('fGoods').value) : '',
    memo: $('fMemo').value.trim(),
    returned,
    returnGift: returned ? $('fReturnGift').value.trim() : '',
    returnDate: returned ? $('fReturnDate').value : '',
    updatedAt: Date.now(),
  };
  // 1件あたりの上限（約1MB）を超える場合は、入力画面を閉じずに知らせる
  if (JSON.stringify(data).length > 900000) {
    alert('写真の容量が大きすぎて保存できません。写真の枚数を減らしてください。');
    return;
  }
  // 通信待ちで固まらないよう、保存の完了は待たずに画面を閉じる（失敗時は通知する）
  setDoc(doc(giftsCol, editingId || newId()), data).catch(showSaveError);
  $('dlgEdit').close();
});

$('btnDel').addEventListener('click', () => {
  if (!confirm('この記録を削除します。元に戻せません。よろしいですか？')) return;
  deleteDoc(doc(giftsCol, editingId)).catch(showSaveError);
  $('dlgEdit').close();
});

$('fReturned').addEventListener('change', toggleReturn);
$('btnCancel').addEventListener('click', () => $('dlgEdit').close());
$('btnAdd').addEventListener('click', () => openEdit(null));
$('list').addEventListener('click', (e) => {
  const el = e.target.closest('.item');
  if (el) openEdit(el.dataset.id);
});
$('q').addEventListener('input', render);
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  render();
}));

// ---- 書き出し・読み込み ----
$('btnBackup').addEventListener('click', () => $('dlgBackup').showModal());
$('btnBackupClose').addEventListener('click', () => $('dlgBackup').close());

$('btnExport').addEventListener('click', async () => {
  const text = JSON.stringify({ app: 'shussan-iwai', version: 1, items }, null, 2);
  const d = new Date();
  const name = `出産祝い管理_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  const file = new File([text], name, { type: 'application/json' });
  // スマホでは共有メニュー（LINE・メール・ファイル保存など）を優先
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

$('btnImport').addEventListener('click', () => $('fileImport').click());
$('fileImport').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (obj.app !== 'shussan-iwai' || !Array.isArray(obj.items)) throw new Error('形式が違います');
    const { added, updated } = await mergeItems(obj.items);
    $('dlgBackup').close();
    alert(`読み込み完了：追加 ${added} 件、更新 ${updated} 件`);
  } catch (err) {
    alert('読み込めませんでした。このアプリで書き出したファイルを選んでください。（' + (err.code || err.message) + '）');
  }
});

render();
</script>
</body>
</html>
